[project]
name = "idea-radar"
version = "1.0.0"
description = "One portfolio-grade build idea per day, mined from live tech signal."
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["radar"]
